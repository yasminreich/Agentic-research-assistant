  <!-- content -->
  <text x="48" y="112" font-size="30" font-weight="700" fill="#1a1a1e">Research Assistant</text>
  <text x="48" y="145" font-size="16" fill="#63636b">Ask a research question. Two AI agents review high-impact</text>
  <text x="48" y="169" font-size="16" fill="#63636b">scientific literature and write you a grounded summary.</text>
  <text x="48" y="216" font-size="14" font-weight="700" fill="#1a1a1e">Research question</text>
  <rect x="48" y="230" width="864" height="96" rx="10" fill="#ffffff" stroke="#e2e2e6"/>
  <text x="66" y="274" font-size="17" fill="#9a9aa4">e.g. Does intermittent fasting improve insulin sensitivity in adults?</text>
  <text x="48" y="350" font-size="13" fill="#63636b">A focused, answerable question works best. Max 500 characters.</text>
  <rect x="48" y="376" width="222" height="48" rx="10" fill="#3b5bdb"/>
  <text x="159" y="405" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Run literature review</text>
