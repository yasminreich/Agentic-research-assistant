# Tooling configuration only — this project is run directly (`python run.py`),
# not installed as a package, so there is no [build-system] / [project] table
# beyond the metadata linters and CI read.

[project]
name = "research-assistant"
version = "0.1.0"
description = "Multi-agent literature review over the OpenAlex corpus, powered by Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["output"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ARG", # unused arguments
    "BLE", # blind except
    "C4",  # comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use assert-heavy, argument-free fixtures.
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
